name: Preview (GitHub Pages)

# Publishes the preview-only static export so it can be reviewed on a phone.
# This is NOT the live site: everything served here is noindex/nofollow and
# the AI Card is only present because the preview flag is set at build time.
#
# The export is committed to the `gh-pages` branch. For a project repository
# GitHub enables Pages from that branch automatically; the default GITHUB_TOKEN
# is not allowed to create a Pages site through the REST API, so the
# artifact-based deploy (actions/deploy-pages) cannot be used until an admin
# enables Pages once in Settings → Pages.

on:
  push:
    branches:
      - cursor/ai-card-v1-preview-3cc6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test
      - name: Build preview export under the Pages sub-path
        run: npm run build
        env:
          NEXT_PUBLIC_AI_CARD_PREVIEW: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish out/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
          commit_message: "Preview export from ${{ github.sha }}"

name: Preview (GitHub Pages)

# Publishes the preview-only static export so it can be reviewed on a phone.
# This is NOT the live site: everything served here is noindex/nofollow and
# the AI Card is only present because the preview flag is set at build time.

on:
  push:
    branches:
      - cursor/ai-card-v1-preview-3cc6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test
      - name: Build preview export under the Pages sub-path
        run: npm run build
        env:
          NEXT_PUBLIC_AI_CARD_PREVIEW: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
